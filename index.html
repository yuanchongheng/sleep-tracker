<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>睡眠规律记录</title><style>:root{--bg:#f6f7fb;--card:#fff;--text:#182033;--muted:#737b90;--line:#e6e9f1;--a:#5b67f1}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}main{max-width:1100px;margin:auto;padding:28px 16px 50px}h1{margin:0 0 6px}.sub{color:var(--muted);font-size:13px;margin-bottom:22px}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px #20283a0d}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 6px}input,textarea{width:100%;padding:10px;border:1px solid #dce1ea;border-radius:10px;font:inherit;margin-bottom:12px}textarea{min-height:70px;resize:vertical}button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.primary{width:100%;background:linear-gradient(135deg,#5b67f1,#8b5cf6);color:#fff}.ghost{background:#f2f4f8;color:#4c566d}.danger{background:#fff0f3;color:#ba4055}.actions{display:flex;gap:8px;margin-top:8px}.actions>*{flex:1}.hint{font-size:11px;line-height:1.5;color:#8a92a6;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{padding:14px}.stat b{display:block;font-size:24px;margin-top:8px}.k{font-size:11px;color:var(--muted)}canvas{width:100%;height:220px;display:block}.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px}.history{margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px;border-bottom:1px solid #edf0f5;font-size:12px;text-align:left}th{color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}}</style></head><body><main><h1>睡眠规律记录</h1><div class="sub">按起床日归档；数据只保存在当前浏览器。支持 CSV 导入/导出。</div><div class="grid"><section class="card"><h3 id="formTitle">登记一次睡眠</h3><form id="f"><label>本次睡眠归属日（起床日）</label><input id="date" type="date" required><div class="row"><div><label>入睡时间</label><input id="bed" type="time" value="00:00" required></div><div><label>起床时间</label><input id="wake" type="time" value="08:00" required></div></div><div id="dur" class="hint" style="font-size:13px;font-weight:700;margin:0 0 12px">预计睡眠：8小时00分</div><label>备注（可选）</label><textarea id="note" placeholder="例如：睡前刷手机、咖啡、夜醒……"></textarea><button class="primary" type="submit" id="save">保存记录</button><div class="actions"><button class="ghost" type="button" id="importBtn">导入 CSV</button><button class="ghost" type="button" id="exportBtn">导出 CSV</button></div><input id="file" type="file" accept=".csv,text/csv" hidden><div class="hint">例如：10 月 26 日 23:45 入睡、10 月 27 日 07:40 起床，这条记录归到 10 月 27 日。规律性评分用于自我观察，不是医学诊断。</div></form></section><section><div class="stats"><div class="card stat"><span class="k">近7天平均睡眠</span><b id="avg">—</b></div><div class="card stat"><span class="k">入睡时间波动</span><b id="bsd">—</b></div><div class="card stat"><span class="k">起床时间波动</span><b id="wsd">—</b></div><div class="card stat"><span class="k">规律性评分</span><b id="score">—</b></div></div><div class="charts"><div class="card"><h3>作息时间趋势</h3><canvas id="timeChart"></canvas></div><div class="card"><h3>睡眠时长</h3><canvas id="durationChart"></canvas></div></div><div class="card" style="margin-top:18px"><h3>7日滚动规律性评分</h3><canvas id="scoreChart"></canvas></div><div class="card history"><div style="display:flex;justify-content:space-between;align-items:center"><h3>睡眠记录</h3><button class="danger" id="clear" type="button">清空全部</button></div><div id="history"></div></div></section></div></main><script>(()=>{const KEY='sleepTracker.v1',$=x=>document.getElementById(x);let records=load(),editing=null;function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function saveAll(){localStorage.setItem(KEY,JSON.stringify(records))}function today(){const d=new Date;d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}function mins(t){const[h,m]=t.split(':').map(Number);return h*60+m}function shiftDate(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function duration(b,w){let d=mins(w)-mins(b);if(d<=0)d+=1440;return d}function dt(date,b,w){const bd=mins(b)>mins(w)?shiftDate(date,-1):date;return{bedDateTime:`${bd}T${b}:00`,wakeDateTime:`${date}T${w}:00`}}function axis(t){let m=mins(t);return m<720?m+1440:m}function sd(a){if(a.length<2)return NaN;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length)}function score(list){if(list.length<3)return NaN;return Math.max(0,Math.min(100,Math.round(100*Math.exp(-(sd(list.map(r=>axis(r.bed)))+sd(list.map(r=>axis(r.wake))))/180))))}function sorted(){return[...records].sort((a,b)=>a.date.localeCompare(b.date))}function recent(n){return sorted().slice(-n)}function fmtMin(m){return Number.isFinite(m)?(m<60?Math.round(m)+'分':(m/60).toFixed(1)+'h'):'—'}function recalc(){$('dur').textContent='预计睡眠：'+Math.floor(duration($('bed').value,$('wake').value)/60)+'小时'+String(duration($('bed').value,$('wake').value)%60).padStart(2,'0')+'分'}$('date').value=today();$('bed').oninput=$('wake').oninput=recalc;$('f').onsubmit=e=>{e.preventDefault();const date=$('date').value,bed=$('bed').value,wake=$('wake').value,note=$('note').value.trim(),d=duration(bed,wake),z=dt(date,bed,wake),id=editing||((crypto&&crypto.randomUUID)?crypto.randomUUID():'r'+Date.now());records=records.filter(r=>r.id!==id&&r.date!==date);records.push({id,date,bed,wake,duration:d,note,...z,updatedAt:Date.now()});saveAll();editing=null;$('note').value='';render()};function renderStats(){const a=recent(7),b=recent(14),s=score(b);$('avg').textContent=a.length?(a.reduce((x,r)=>x+r.duration,0)/a.length/60).toFixed(1)+'h':'—';$('bsd').textContent=fmtMin(sd(b.map(r=>axis(r.bed))));$('wsd').textContent=fmtMin(sd(b.map(r=>axis(r.wake))));$('score').textContent=Number.isFinite(s)?s:'—'}function lineChart(id,data,getY,min,max,label){const c=$(id),r=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=r.width*dpr;c.height=220*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const W=r.width,H=220,L=42,R=10,T=12,B=26;x.strokeStyle='#edf0f5';for(let i=0;i<5;i++){let y=T+(H-T-B)*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke()}if(data.length<2){x.fillStyle='#8a92a6';x.textAlign='center';x.fillText('记录更多数据后显示趋势',W/2,H/2);return}const px=i=>L+(W-L-R)*i/(data.length-1),py=v=>T+(H-T-B)*(1-(v-min)/(max-min));x.strokeStyle='#5b67f1';x.lineWidth=2;x.beginPath();data.forEach((r,i)=>i?x.lineTo(px(i),py(getY(r))):x.moveTo(px(i),py(getY(r))));x.stroke();x.fillStyle='#7b8499';x.font='10px system-ui';x.textAlign='right';for(let i=0;i<5;i++){let v=max-(max-min)*i/4;x.fillText(label(v),L-6,T+(H-T-B)*i/4+3)}}function draw(){const r14=recent(14);if(r14.length){const vals=r14.flatMap(r=>[axis(r.bed),axis(r.wake)]),mn=Math.floor((Math.min(...vals)-60)/60)*60,mx=Math.ceil((Math.max(...vals)+60)/60)*60;lineChart('timeChart',r14,r=>axis(r.bed),mn,mx,v=>{v=((Math.round(v)%1440)+1440)%1440;return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')})}else lineChart('timeChart',[],()=>0,0,1,()=>"");const maxD=Math.max(10,...r14.map(r=>r.duration/60+1));lineChart('durationChart',r14,r=>r.duration/60,0,maxD,v=>v.toFixed(1)+'h');const all=sorted(),pts=all.map((r,i)=>({date:r.date,s:score(all.slice(Math.max(0,i-6),i+1))})).filter(p=>Number.isFinite(p.s));lineChart('scoreChart',pts,p=>p.s,0,100,v=>Math.round(v))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function renderHistory(){if(!records.length){$('history').innerHTML='<div class="empty">还没有记录</div>';return}$('history').innerHTML='<table><thead><tr><th>归属日</th><th>实际入睡</th><th>实际起床</th><th>时长</th><th>备注</th><th></th></tr></thead><tbody>'+[...records].sort((a,b)=>b.date.localeCompare(a.date)).map(r=>{const z=r.bedDateTime?{bedDateTime:r.bedDateTime,wakeDateTime:r.wakeDateTime}:dt(r.date,r.bed,r.wake);return`<tr><td>${r.date}</td><td>${z.bedDateTime.replace('T',' ')}</td><td>${z.wakeDateTime.replace('T',' ')}</td><td>${(r.duration/60).toFixed(1)}h</td><td>${esc(r.note||'—')}</td><td><button class="ghost" onclick="window.delRec('${r.id}')">删除</button></td></tr>`}).join('')+'</tbody></table>'}window.delRec=id=>{if(confirm('删除这条记录？')){records=records.filter(r=>r.id!==id);saveAll();render()}};$('clear').onclick=()=>{if(records.length&&confirm('确定清空全部记录？')){records=[];saveAll();render()}};function csvParse(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let ch=text[i];if(q){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')q=false;else cell+=ch}else{if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch!=='\r')cell+=ch}}if(cell||row.length){row.push(cell);rows.push(row)}return rows}$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const rows=csvParse((await f.text()).replace(/^\uFEFF/,''));if(rows.length<2)return alert('CSV 无数据');const h=rows[0],ix=n=>h.indexOf(n),old=ix('起床日期')>=0;for(const row of rows.slice(1)){let date,bed,wake,note='';if(old){date=row[ix('起床日期')];bed=row[ix('入睡时间')];wake=row[ix('起床时间')];note=row[ix('备注')]||''}else{date=row[ix('归属日(起床日)')];const b=(row[ix('实际入睡日期时间')]||'').replace(' ','T'),w=(row[ix('实际起床日期时间')]||'').replace(' ','T');bed=(b.match(/T(\d{2}:\d{2})/)||[])[1];wake=(w.match(/T(\d{2}:\d{2})/)||[])[1];note=row[ix('备注')]||''}if(!date||!bed||!wake)continue;const z=dt(date,bed,wake),item={id:'r'+Date.now()+Math.random(),date,bed,wake,duration:duration(bed,wake),note,...z,updatedAt:Date.now()};records=records.filter(r=>r.date!==date);records.push(item)}saveAll();render();e.target.value=''};$('exportBtn').onclick=()=>{if(!records.length)return;const rows=[['归属日(起床日)','实际入睡日期时间','实际起床日期时间','睡眠时长(分钟)','备注']];sorted().forEach(r=>{const z=r.bedDateTime?{bedDateTime:r.bedDateTime,wakeDateTime:r.wakeDateTime}:dt(r.date,r.bed,r.wake);rows.push([r.date,z.bedDateTime,z.wakeDateTime,r.duration,r.note||''])});const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='睡眠记录_'+today()+'.csv';a.click()};function render(){renderStats();renderHistory();requestAnimationFrame(draw)}window.addEventListener('resize',()=>requestAnimationFrame(draw));recalc();render()})();</script></body></html>
